apiVersion: v1
kind: ConfigMap

metadata:
  name: backend-config

data:
  NODE_ENV: "production"
  PORT: "8081"
  DB_PORT: "5432"
  DB_DIALECT: "postgres"
  CORS_ORIGINS: "https://www.jawsight.online"
  AWS_REGION: "ap-south-1"
  SQS_QUEUE_URL: "https://sqs.ap-south-1.amazonaws.com/915658834610/jawsight-image-processor-image-processing-queue"
  S3_BUCKET: "jawsight-image-processor-dev-data"
  FRONTEND_URL: "https://www.jawsight.online"
  BACKEND_URL: "https://www.jawsight.online"
  REDIS_URL: "redis://redis-service:6379"
  AWS_XRAY_ENABLED: "true"
  AWS_XRAY_TRACING_NAME: "jawsight-backend"
  AWS_XRAY_DAEMON_ADDRESS: "xray-service.xray.svc.cluster.local:2000"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service-account
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-service-account

      containers:
        - name: backend-container
          image: 915658834610.dkr.ecr.ap-south-1.amazonaws.com/jawsight/backend:v8
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
