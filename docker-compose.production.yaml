services:
  redis:
    image: redis:alpine
    container_name: jawsight_dev_redis
    restart: always

  backend:
    # REPLACE with your actual AWS Account ID and Region
    image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/jawsight-backend:latest
    container_name: jawsight_backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379

  frontend:
    # REPLACE with your actual AWS Account ID and Region
    image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/jawsight-frontend:latest
    container_name: jawsight_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: jawsight_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
