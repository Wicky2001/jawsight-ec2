events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Internal Docker DNS mapping
    upstream frontend_app {
        server frontend:8080;
    }

    # Sticky sessions aren't strictly necessary with a single backend container,
    # but ip_hash mimics the intent of your K8s affinity cookie for scaling later.
    upstream backend_app {
        ip_hash; 
        server backend:8081;
    }

    server {
        # Listen on port 80 and expect Proxy Protocol from the AWS NLB
        listen 80 proxy_protocol;
        server_name www.jawsight.online;

        set_real_ip_from 10.0.0.0/16; # Truest proxy protocol only if proxy protocol is coming from within your VPC CIDR.
        real_ip_header proxy_protocol; # By default, NGINX looks at the network packet's source IP. By setting this to proxy_protocol, you are instructing NGINX to unpack the extra header appended by the AWS NLB and use the IP hidden inside that header instead.


        # Socket.io Configuration (WebSockets)
        location /socket.io/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;   # $host is an NGINX variable containing the domain name requested by the user (e.g., www.jawsight.online).
                                           # This line ensures that your backend application knows the actual domain name the user typed into their browser, which is critical for security routing, cookies, and generating absolute redirect URLs.
            proxy_set_header X-Real-IP $proxy_protocol_addr;  # This is a built-in NGINX variable that specifically holds the client IP address that was extracted out of the Proxy Protocol header sent by the AWS NLB. For example, if a user at home visits your site, this variable will equal exactly 203.0.113.50
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        }

        # ACME Challenge (If you still need it, though NLB handles TLS)
        location /.well-known/acme-challenge/ {
            proxy_pass http://backend_app;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        }
    }
}