name: Deploy to Production EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPO: jawsight-production-backend
  ECR_FRONTEND_REPO: jawsight-production-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Detect which folders changed
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'nginx.conf'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 2. Build Backend ONLY if backend files changed
      - name: Build and push Backend Image
        if: steps.changes.outputs.backend == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_BACKEND_REPO }}:latest -f backend/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.ECR_BACKEND_REPO }}:latest

      # 3. Build Frontend ONLY if frontend files changed
      - name: Build and push Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://www.jawsight.online \
            --build-arg VITE_XRAY_ENABLED=false \
            -t $ECR_REGISTRY/${{ env.ECR_FRONTEND_REPO }}:latest -f frontend/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.ECR_FRONTEND_REPO }}:latest

      # 4. Upload files to S3 (The secure middleman for Private Subnets)
      - name: Prepare and Upload files to S3
        run: |
          # 1. Create the .env file locally on the GitHub Runner
          echo "${{ secrets.BACKEND_PROD_ENV }}" > .env

          # 2. Upload everything to your secure S3 bucket
          aws s3 cp docker-compose.prod.yml s3://jawsight-deployment-artifacts/
          aws s3 cp nginx.conf s3://jawsight-deployment-artifacts/
          aws s3 cp .env s3://jawsight-deployment-artifacts/.env

      # 5. Execute Deployment Commands via AWS SSM
      - name: Execute Deployment Commands via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p ~/app",
              "cd ~/app",
              
              "# Download the fresh files from S3",
              "aws s3 cp s3://jawsight-deployment-artifacts/docker-compose.prod.yml .",
              "aws s3 cp s3://jawsight-deployment-artifacts/nginx.conf .",
              "aws s3 cp s3://jawsight-deployment-artifacts/.env .",
              
              "# Authenticate with ECR and restart containers",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d"
            ]' \
            --region ${{ env.AWS_REGION }}
