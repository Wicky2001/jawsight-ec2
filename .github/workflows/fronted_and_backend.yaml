name: Deploy to Production EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPO: jawsight-production-backend
  ECR_FRONTEND_REPO: jawsight-production-frontend
  ECR_MIGRATIONS_REPO: jawsight-production-migrations

jobs:
  deploy-to-ec2:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Detect which folders changed
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            migrations:
              - 'sequelizer/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'nginx.conf'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 2. Build Backend ONLY if backend files changed
      - name: Build and push Backend Image
        if: steps.changes.outputs.backend == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_BACKEND_REPO }}:latest -f backend/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.ECR_BACKEND_REPO }}:latest

      # 3. Build Frontend ONLY if frontend files changed
      - name: Build and push Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://www.jawsight.online \
            --build-arg VITE_XRAY_ENABLED=false \
            -t $ECR_REGISTRY/${{ env.ECR_FRONTEND_REPO }}:latest -f frontend/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.ECR_FRONTEND_REPO }}:latest

      - name: Build and push Migrations Image
        if: steps.changes.outputs.migrations == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_MIGRATIONS_REPO }}:latest -f sequelizer/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.ECR_MIGRATIONS_REPO }}:latest

      # 4. Upload files to S3 (The secure middleman for Private Subnets)
      - name: Prepare and Upload files to S3
        run: |
          # 1. Create the .env file locally on the GitHub Runner
          echo "${{ secrets.BACKEND_PROD_ENV }}" > .env

          # 2. Upload everything to your secure S3 bucket
          aws s3 cp docker-compose.prod.yml s3://jawsight-deployment-artifacts-473280638005/
          aws s3 cp nginx.conf s3://jawsight-deployment-artifacts-473280638005/
          aws s3 cp .env s3://jawsight-deployment-artifacts-473280638005/.env

      # 5. Execute Deployment Commands via AWS SSM
      - name: Execute Deployment Commands via AWS SSM
        run: |
          # 1. Trigger the command and capture the unique Command ID
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /home/ec2-user/app",
              "chown -R ec2-user:ec2-user /home/ec2-user/app",
              "aws s3 cp s3://jawsight-deployment-artifacts-473280638005/docker-compose.prod.yml /home/ec2-user/app/docker-compose.prod.yml",
              "aws s3 cp s3://jawsight-deployment-artifacts-473280638005/nginx.conf /home/ec2-user/app/nginx.conf",
              "aws s3 cp s3://jawsight-deployment-artifacts-473280638005/.env /home/ec2-user/app/.env",
              "cd /home/ec2-user/app && aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "cd /home/ec2-user/app && docker compose -f docker-compose.prod.yml pull",
              "cd /home/ec2-user/app && docker compose -f docker-compose.prod.yml up -d | docker restart jawsight_nginx"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command triggered successfully. Command ID: $COMMAND_ID"
          echo "Waiting for the deployment script to complete on the EC2 instance..."

          # 2. Wait until the command transitions out of Pending/InProgress
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} || true # Avoid exiting early if the command fails, we want to fetch logss

          # 3. Fetch the final status and execution output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} \
            --query "{Status: Status, Stdout: StandardOutputContent, Stderr: StandardErrorContent}" \
            --output json)

          STATUS=$(echo "$OUTPUT" | jq -r '.Status')
          STDOUT=$(echo "$OUTPUT" | jq -r '.Stdout')
          STDERR=$(echo "$OUTPUT" | jq -r '.Stderr')

          # 4. Print the execution logs to the GitHub runner console
          echo "=== EC2 DEPLOYMENT STANDARD OUTPUT ==="
          echo "$STDOUT"

          if [ "$STATUS" != "Success" ]; then
            echo "=== EC2 DEPLOYMENT ERROR LOGS ==="
            echo "$STDERR"
            echo "Error: SSM Deployment failed with status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully with status: $STATUS"
